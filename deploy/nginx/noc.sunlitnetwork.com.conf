# HTTPS for noc.sunlitnetwork.com behind Cloudflare (SSL mode: Full (strict)).
#
# Uses a Cloudflare Origin Certificate (SSL/TLS -> Origin Server -> Create
# Certificate). Plain HTTP on port 80 stays on the existing default site,
# which the ZKTeco attendance devices post to by IP.
#
# Install:
#   sudo cp deploy/nginx/noc.sunlitnetwork.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/noc.sunlitnetwork.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name noc.sunlitnetwork.com;

    ssl_certificate     /etc/ssl/cloudflare/noc.sunlitnetwork.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/noc.sunlitnetwork.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/olt-panel/public;
    index index.php;

    client_max_body_size 20m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Never serve dotfiles (.env, .git, ...).
    location ~ /\.(?!well-known) {
        deny all;
    }
}
